<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typefaces</title>

    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
     <section class="column typefaces" id="typefaces">
      <header class="column-nav">
        <span>PROJECT ONE</span><span>TYPEFACES</span><span>IN THE MOMENT</span>
      </header>
      <h2 class="section-title">TYPEFACES</h2>

      <div class="type-banner">
        <img src="images/typefaces-collage.jpg" alt="Typography collage">
      </div>

      <article class="olive-copy">
        <p>Typefaces communicate tone, personality and character. Different letterforms create different visual experiences.</p>
      </article>

      <article class="specimen orange-specimen">
        <div class="aa">Aa</div>
        <div class="specimen-copy">A a B b C c D d E e F f G g<br>Typography · Form · Style</div>
        <div class="sample-row">
          <div class="sample serif">Aa</div>
          <div class="sample sans">Aa</div>
          <div class="sample slab">Aa</div>
        </div>
      </article>

      <div class="orange-rule"><i></i><i></i></div>

      <article class="specimen orange-specimen second-specimen">
        <div class="aa">Aa</div>
        <div class="specimen-copy">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br>abcdefghijklmnopqrstuvwxyz</div>
        <div class="sample-row">
          <div class="sample montagu">Aa</div>
          <div class="sample black">Aa</div>
          <div class="sample type-image"><img src="images/montagu-styles.jpg" alt="Montagu Slab type styles"></div>
        </div>
      </article>

      <div class="orange-rule"><i></i><i></i></div>
    </section>
</body>
</html>
